<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Graduation cap & speech bubble / letters icon -->
  <g filter="url(#shadow)" transform="translate(100, 100) scale(0.6)">
    <!-- Book/Card background -->
    <rect x="20" y="40" width="480" height="360" rx="36" fill="#ffffff" />
    <path d="M 260 400 L 220 460 L 300 400 Z" fill="#ffffff" />
    <!-- Letter A and Flag/Check -->
    <text x="140" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="200" font-weight="900" fill="#4f46e5">A</text>
    <text x="290" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="200" font-weight="900" fill="#f59e0b">Z</text>
    <!-- Stars -->
    <polygon points="410,90 422,126 460,126 430,148 441,184 410,162 379,184 390,148 360,126 398,126" fill="#fbbf24" />
  </g>
</svg>
